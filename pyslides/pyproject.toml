[project]
name = "pyslides"
version = "0.1.0"
description = "A Python library for creating dynamic, interactive HTML presentations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "plotly>=5.0.0",
    "jinja2>=3.0.0",
    "numpy",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
