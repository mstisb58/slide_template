<!-- 2Dグラフのサンプル (Plotly) -->
<div id="chart-2d" style="width: 100%; height: 460px;"></div>

<script>
(function() {
  function render() {
    const el = document.getElementById('chart-2d');
    if (!el || typeof Plotly === 'undefined') return;

    const data = [
      {
        x: ['1月', '2月', '3月', '4月', '5月', '6月'],
        y: [12, 28, 45, 38, 62, 90],
        type: 'scatter',
        mode: 'lines+markers',
        name: '実績値',
        line: { color: '#38bdf8', width: 3 },
        marker: { size: 8 }
      },
      {
        x: ['1月', '2月', '3月', '4月', '5月', '6月'],
        y: [15, 20, 35, 40, 50, 70],
        type: 'bar',
        name: '目標値',
        marker: { color: 'rgba(129, 140, 248, 0.5)' }
      }
    ];

    const layout = {
      margin: { l: 50, r: 20, b: 50, t: 30 },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: { color: '#94a3b8' },
      xaxis: { gridcolor: 'rgba(255,255,255,0.1)' },
      yaxis: { gridcolor: 'rgba(255,255,255,0.1)' },
      legend: { font: { color: '#f8fafc' } }
    };

    Plotly.newPlot(el, data, layout, { responsive: true });
  }

  if (document.readyState === 'complete') {
    render();
  } else {
    window.addEventListener('load', render);
  }
  document.addEventListener('reveal-slide-changed', render);
})();
</script>
