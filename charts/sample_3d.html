<!-- 3Dグラフのサンプル (Plotly) -->
<div id="chart-3d" style="width: 100%; height: 460px;"></div>

<script>
(function() {
  function render() {
    const el = document.getElementById('chart-3d');
    if (!el || typeof Plotly === 'undefined') return;

    // 3D曲面データの生成 (シンプルに計算)
    const size = 30;
    const x = [], y = [], z = [];
    for (let i = 0; i < size; i++) {
      x.push(i - size / 2);
      y.push(i - size / 2);
    }
    for (let i = 0; i < size; i++) {
      const row = [];
      for (let j = 0; j < size; j++) {
        const r = Math.sqrt(x[i] * x[i] + y[j] * y[j]) + 0.1;
        row.push(Math.sin(r) / r * 8);
      }
      z.push(row);
    }

    const data = [{
      type: 'surface',
      z: z,
      x: x,
      y: y,
      colorscale: 'Viridis',
      showscale: false
    }];

    const layout = {
      margin: { l: 0, r: 0, b: 0, t: 0 },
      paper_bgcolor: 'rgba(0,0,0,0)',
      scene: {
        xaxis: { title: 'X', color: '#94a3b8' },
        yaxis: { title: 'Y', color: '#94a3b8' },
        zaxis: { title: 'Z', color: '#94a3b8' }
      }
    };

    Plotly.newPlot(el, data, layout, { responsive: true });
  }

  // 描画実行
  if (document.readyState === 'complete') {
    render();
  } else {
    window.addEventListener('load', render);
  }
  document.addEventListener('reveal-slide-changed', render);
})();
</script>
