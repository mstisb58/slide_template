/* ==========================================================================
   pyslides Design System: Kracie 5-Color Golden Ratio Theme (1280x720)
   ========================================================================== */

:root {
  /* --- Typography --- */
  --font-main: "BIZ UDPGothic", "BIZ UDPゴシック", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-code: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;

  /* --- 5色黄金比カラーパレット (Kracie Corporate & Semantic) --- */
  --bg-main: #ffffff;
  --bg-dark: #0f172a;
  --text-main: #1e293b;
  --text-sub: #64748b;
  --text-muted: #94a3b8;

  /* メインアクセント (Kracie Yellow) */
  --accent: #FFD500;
  --accent-light: #FFF4B8;
  --accent-soft: rgba(255, 213, 0, 0.15);
  --accent-dark: #b45309;

  /* サブアクセント (Royal Blue) */
  --accent-blue: #002BFF;
  --accent-blue-light: #EBF0FF;
  --accent-blue-soft: rgba(0, 43, 255, 0.08);

  /* セマンティックカラー (Red, Green, Gold) */
  --color-red: #ef4444;
  --color-red-soft: rgba(239, 68, 68, 0.08);
  --color-green: #10b981;
  --color-green-soft: rgba(16, 185, 129, 0.08);
  --color-gold: #b45309;
  --color-gold-soft: rgba(180, 83, 9, 0.08);

  /* 構造・境界線 */
  --border-color: #e2e8f0;
  --border-light: #f1f5f9;
  --card-bg: #ffffff;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.12);
}

/* ==========================================================================
   スライド全体・キャンバス設定 (1280x720 固定16:9)
   ========================================================================== */
body,
.reveal {
  font-family: var(--font-main) !important;
  background-color: #0b0f19 !important;
  color: var(--text-main) !important;
  font-size: 24px;
}

/* 16:9 黄金比スライド用紙（上下のイエローグラデーションバー付き） */
.reveal .slides {
  text-align: left;
  background-color: var(--bg-main) !important;
  background-image:
    linear-gradient(to bottom, var(--accent) 0px, rgba(255, 213, 0, 0.4) 6px, transparent 28px),
    linear-gradient(to top, var(--accent) 0px, rgba(255, 213, 0, 0.4) 6px, transparent 28px) !important;
  box-shadow: var(--shadow-lg) !important;
  border-radius: 4px;
}

.reveal .slides section:not(.stack),
.reveal .slides section.stack > section {
  height: 720px !important;
  min-height: 720px !important;
  max-height: 720px !important;
  top: 0 !important;
  left: 0 !important;
  padding: 35px 55px !important;
  box-sizing: border-box !important;
}

/* ==========================================================================
   タイポグラフィ (見出し・テキスト)
   ========================================================================== */
.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4 {
  color: var(--text-main) !important;
  font-weight: 700 !important;
  letter-spacing: -0.01em;
  text-transform: none !important;
}

/* 大見出し (h1) */
.reveal h1 {
  font-size: 2.4em !important;
  margin-bottom: 0.3em !important;
  line-height: 1.25 !important;
}

/* スライドタイトル (h2: 右端までアクセントバーが横断) */
.reveal h2 {
  width: 100% !important;
  display: block !important;
  box-sizing: border-box !important;
  font-size: 1.55em !important;
  border-bottom: 2px solid var(--accent);
  padding-bottom: 8px;
  margin: 0 0 20px 0 !important;
  line-height: 1.3 !important;
}

/* 小見出し (h3: ロイヤルブルーで強調) */
.reveal h3 {
  font-size: 1.15em !important;
  color: var(--accent-blue) !important;
  margin: 0 0 10px 0 !important;
}

/* 本文・リスト */
.reveal p {
  line-height: 1.6 !important;
  margin: 0 0 12px 0 !important;
}

.reveal ul,
.reveal ol {
  line-height: 1.6 !important;
  margin: 0 0 12px 24px !important;
  padding: 0 !important;
}

.reveal li {
  margin-bottom: 6px !important;
}

/* 強調文字 (Markdownの **太字**) ➜ ロイヤルブルー太字 */
.reveal strong,
.reveal b {
  color: var(--accent-blue) !important;
  font-weight: 700 !important;
}

/* 引用 */
.reveal blockquote {
  background: var(--accent-soft);
  border-left: 4px solid var(--accent);
  padding: 10px 16px;
  margin: 14px 0;
  font-style: normal;
  border-radius: 4px;
}

/* インラインコード */
.reveal code:not(pre code) {
  background: var(--accent-soft);
  color: var(--accent-dark);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--font-code) !important;
  font-weight: 600;
  font-size: 0.88em;
}

/* コードブロック */
.reveal pre {
  box-shadow: var(--shadow-md) !important;
  border-radius: 6px !important;
  margin: 14px 0 !important;
}

.reveal pre code {
  font-family: var(--font-code) !important;
  font-size: 0.82em !important;
  line-height: 1.45 !important;
  padding: 14px 18px !important;
  border-radius: 6px !important;
}

/* ==========================================================================
   テーブル（表）
   ========================================================================== */
.reveal table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 0.82em;
}

.reveal th,
.reveal td {
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  text-align: left;
}

.reveal th {
  background: var(--accent-soft);
  color: var(--text-main);
  font-weight: 700;
  border-bottom: 2px solid var(--accent);
}

.reveal tr:nth-child(even) {
  background: #f8fafc;
}

/* カード・グリッド内のコンパクトなテーブル表示 */
.card table,
.card .slide-table,
.grid-cell table {
  width: 100% !important;
  margin: 8px 0 !important;
  font-size: 0.70em !important;
}

.card th,
.card td,
.grid-cell th,
.grid-cell td {
  padding: 5px 8px !important;
  word-break: break-word;
}

/* ==========================================================================
   1. 表紙（タイトルスライド）
   ========================================================================== */
.reveal .slides section.title-section {
  height: 720px !important;
  min-height: 720px !important;
  padding: 50px 60px !important;
  box-sizing: border-box !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
}

.title-slide {
  position: relative !important;
  width: 100% !important;
  height: 100% !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  box-sizing: border-box !important;
}

/* 左上の日付 */
.title-slide .title-date {
  position: absolute !important;
  top: 90px !important;
  left: 0px !important;
  font-size: 1.8em !important;
  color: var(--text-sub) !important;
  font-weight: 500;
  letter-spacing: 0.05em;
}

/* 中央のタイトル・サブタイトル */
.title-slide .title-body {
  width: 100% !important;
  text-align: center !important;
  margin: auto 0 !important;
}

.title-slide .title-body h1 {
  margin: 0 0 16px 0 !important;
  font-size: 2.8em !important;
  color: var(--text-main) !important;
  line-height: 1.25 !important;
  font-weight: 800 !important;
}

.title-slide .title-body .title-subtitle {
  margin: 0 !important;
  font-size: 1.8em !important;
  color: var(--text-sub) !important;
  font-weight: 500;
}

/* 右下の発表者名 */
.title-slide .title-author {
  position: absolute !important;
  bottom: 50px !important;
  right: 40px !important;
  font-size: 1.8em !important;
  color: var(--text-sub) !important;
  font-weight: 600 !important;
}

/* ==========================================================================
   2. 目次（アジェンダ）
   ========================================================================== */
.agenda-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 20px;
}

.agenda-item {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #ffffff;
  border: 1px solid var(--border-color);
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 0.95em;
  color: var(--text-main);
  box-shadow: var(--shadow-sm);
  transition: all 0.3s ease;
}

.agenda-num {
  background: var(--accent);
  color: #000000;
  font-weight: 800;
  min-width: 34px;
  height: 34px;
  padding: 0 6px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 17px;
  font-size: 0.88em;
  flex-shrink: 0;
}

/* アジェンダのステップハイライト */
.agenda-list.is-step .agenda-item.fragment {
  opacity: 1 !important;
  visibility: visible !important;
}

.agenda-list.is-step:has(.agenda-item.current-fragment) .agenda-item:not(.current-fragment),
.agenda-list:has(.agenda-item.is-active) .agenda-item:not(.is-active) {
  opacity: 0.3 !important;
  filter: grayscale(50%);
  transform: scale(0.98);
}

.agenda-list.is-step .agenda-item.current-fragment,
.agenda-list .agenda-item.is-active,
.agenda-item.is-active,
.agenda-item.active-fixed {
  opacity: 1.0 !important;
  border-color: var(--accent) !important;
  background: var(--accent-light) !important;
  box-shadow: 0 4px 20px rgba(255, 213, 0, 0.4) !important;
  transform: scale(1.02);
  filter: none !important;
}

.agenda-list.is-step .agenda-item.current-fragment .agenda-num,
.agenda-list .agenda-item.is-active .agenda-num,
.agenda-item.is-active .agenda-num,
.agenda-item.active-fixed .agenda-num {
  background: var(--accent) !important;
  color: #000000 !important;
  box-shadow: 0 0 14px var(--accent);
}

.agenda-item.dimmed {
  opacity: 0.28 !important;
  filter: grayscale(60%);
  transform: scale(0.98);
}

.agenda-step-trigger {
  display: none !important;
}

/* ==========================================================================
   3. グリッドレイアウト & カードシステム
   ========================================================================== */
.reveal .slides section:not(.title-section) {
  display: flex !important;
  flex-direction: column !important;
  height: 720px !important;
  max-height: 720px !important;
  box-sizing: border-box !important;
  overflow: hidden !important;
  justify-content: flex-start !important;
}

.reveal .slides section:not(.title-section) > h2,
.reveal .slides section:not(.title-section) > p,
.reveal .slides section:not(.title-section) > ul,
.reveal .slides section:not(.title-section) > ol,
.reveal .slides section:not(.title-section) > .point-box,
.reveal .slides section:not(.title-section) > .layout-memo {
  flex-shrink: 0 !important;
}

.custom-grid {
  display: grid !important;
  width: 100% !important;
  box-sizing: border-box !important;
  margin: 8px 0 !important;
  flex: 1 1 0 !important;
  min-height: 0 !important;
  height: 100% !important;
  align-items: stretch !important;
}

.custom-grid .grid-cell {
  min-width: 0 !important;
  min-height: 0 !important;
  width: 100% !important;
  height: 100% !important;
  box-sizing: border-box !important;
  overflow: hidden !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: stretch !important;
  justify-content: center !important;
}

.custom-grid .grid-cell > p,
.custom-grid .grid-cell > ul,
.custom-grid .grid-cell > ol,
.custom-grid .grid-cell > h3 {
  flex-shrink: 0 !important;
}

.custom-grid .grid-cell > .slide-image,
.custom-grid .grid-cell > .included-chart-container,
.custom-grid .grid-cell > .card {
  flex: 1 1 0 !important;
  min-height: 0 !important;
  min-width: 0 !important;
  height: 100% !important;
  width: 100% !important;
}

/* カードコンポーネント */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px 18px !important;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  box-sizing: border-box !important;
  overflow-wrap: break-word;
  word-break: break-word;
  height: 100% !important;
}

.card > p,
.card > ul,
.card > table,
.card > h3 {
  flex-shrink: 0 !important;
}

/* カードカラーバリエーション */
.card.card-yellow {
  background: var(--accent-light) !important;
  border-color: rgba(255, 213, 0, 0.5) !important;
}

.card.card-red {
  background: var(--color-red-soft) !important;
  border-color: rgba(239, 68, 68, 0.35) !important;
}

.card.card-blue {
  background: var(--accent-blue-soft) !important;
  border-color: rgba(0, 43, 255, 0.35) !important;
}

.card.card-green {
  background: var(--color-green-soft) !important;
  border-color: rgba(16, 185, 129, 0.35) !important;
}

.card.card-gold {
  background: var(--color-gold-soft) !important;
  border-color: rgba(180, 83, 9, 0.35) !important;
}

/* ==========================================================================
   4. メモ・ポイント・画像コンテナ
   ========================================================================== */
/* ポイント強調ボックス (Point Box) */
.point-box {
  background: var(--accent-soft);
  border-left: 5px solid var(--accent);
  padding: 10px 16px;
  border-radius: 4px;
  margin: 12px 0;
  flex-shrink: 0;
}

.point-box p {
  margin: 0 !important;
  font-weight: 500;
}

/* 考察・まとめメモバー (Memo Box: 下部に吸着) */
.layout-memo {
  background: #f8fafc;
  border-left: 5px solid var(--accent-blue);
  border-radius: 4px;
  padding: 8px 16px;
  font-size: 0.85em;
  margin-top: auto !important;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

.layout-memo p {
  margin: 0 !important;
}

.layout-memo ul {
  margin: 0 0 0 18px !important;
}

/* 画像コンテナ (add_image) */
.slide-image {
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  height: 100% !important;
  max-width: 100% !important;
  max-height: 100% !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  flex: 1 1 0 !important;
  min-height: 0 !important;
  min-width: 0 !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
}

/* 画像本体: アスペクト比を保って入る方に自動縮小 */
.slide-image img,
.slide-image > img,
.custom-grid .grid-cell img,
.reveal section img.slide-img,
.reveal .slides section img {
  max-width: 100% !important;
  max-height: 100% !important;
  width: auto !important;
  height: auto !important;
  object-fit: contain !important;
  margin: auto !important;
  display: block !important;
  box-sizing: border-box !important;
  flex-shrink: 1 !important;
  min-height: 0 !important;
  min-width: 0 !important;
  border-radius: 4px;
}

.slide-image figcaption {
  font-size: 0.75em;
  color: var(--text-sub);
  margin-top: 4px;
  text-align: center;
  flex-shrink: 0;
}

/* 横並び画像コンテナ */
.images-2 {
  display: flex;
  gap: 24px;
  justify-content: center;
  align-items: center;
  margin: 16px 0;
  flex: 1 1 0 !important;
  min-height: 0 !important;
}

.images-2 img,
.images-2 .slide-img {
  max-width: 48% !important;
  max-height: 100% !important;
  object-fit: contain;
  background: transparent !important;
}

.images-3 {
  display: flex;
  gap: 16px;
  justify-content: center;
  align-items: center;
  margin: 16px 0;
  flex: 1 1 0 !important;
  min-height: 0 !important;
}

.images-3 img,
.images-3 .slide-img {
  max-width: 31% !important;
  max-height: 100% !important;
  object-fit: contain;
  background: transparent !important;
}

/* ==========================================================================
   5. インタラクティブグラフ (Plotly)
   ========================================================================== */
.included-chart-container {
  width: 100% !important;
  height: 100% !important;
  flex: 1 1 0 !important;
  min-height: 0 !important;
  min-width: 0 !important;
  position: relative !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
  scrollbar-width: none !important;
  display: flex !important;
  flex-direction: column !important;
}

.included-chart-container *::-webkit-scrollbar {
  display: none !important;
}

.included-chart-container > div {
  width: 100% !important;
  height: 100% !important;
  flex: 1 1 0 !important;
  min-height: 0 !important;
  min-width: 0 !important;
  display: flex !important;
  flex-direction: column !important;
}

.included-chart-container .plotly-graph-div,
.included-chart-container .js-plotly-plot {
  width: 100% !important;
  height: 100% !important;
  flex: 1 1 0 !important;
  min-height: 0 !important;
  min-width: 0 !important;
}

/* ==========================================================================
   6. テンプレート別スタイル (title, agenda, normal, default & custom)
   ========================================================================== */
/* 標準スライド (normal): h2 タイトル付き */
.reveal .slides section.normal-section {
  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-start !important;
}

/* 白紙マスタ (default): タイトルすらない完全白紙マスタ（ロゴと上下帯のみ） */
.reveal .slides section.default-section {
  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-start !important;
}

/* ユーザー定義カスタムテンプレート (例: template="grid3" 等の拡張フック) */
.reveal .slides section[class*="-section"] {
  box-sizing: border-box !important;
}

/* ==========================================================================
   7. コントロールボタンバー (左下)
   ========================================================================== */
.slide-controls-bar {
  position: fixed;
  bottom: 16px;
  left: 16px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 8px;
}

.control-btn {
  background: rgba(255, 255, 255, 0.9);
  color: var(--text-main);
  border: 1px solid #cbd5e1;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
}

.control-btn:hover {
  background: var(--accent);
  color: #000000;
  border-color: var(--accent);
  transform: translateY(-1px);
}

.control-btn.laser-active {
  background: #ff2a2a !important;
  color: #ffffff !important;
  border-color: #ff0033 !important;
  box-shadow: 0 0 10px rgba(255, 42, 42, 0.7) !important;
}

/* ==========================================================================
   レーザーポインター (Zoom/画面共有用 DOMポインター & クリック波紋)
   ========================================================================== */
.laser-pointer {
  position: fixed;
  top: -100px;
  left: -100px;
  width: 14px;
  height: 14px;
  background: radial-gradient(circle, #ffffff 15%, #ff2a2a 60%, #cc0000 100%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 999999;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 6px #ffffff, 0 0 12px #ff2a2a, 0 0 24px #ff0033, 0 0 36px rgba(255, 0, 50, 0.6);
  opacity: 0;
  transition: opacity 0.15s ease;
}

body.laser-pointer-active .laser-pointer {
  opacity: 1;
}

body.laser-pointer-active,
body.laser-pointer-active * {
  cursor: none !important;
}

body.laser-pointer-active .slide-controls-bar,
body.laser-pointer-active .slide-controls-bar * {
  cursor: pointer !important;
}

.laser-ripple {
  position: fixed;
  width: 24px;
  height: 24px;
  border: 2px solid #ff2a2a;
  border-radius: 50%;
  pointer-events: none;
  z-index: 999998;
  transform: translate(-50%, -50%) scale(0.5);
  box-shadow: 0 0 10px #ff0033;
  animation: laser-ripple-anim 0.45s ease-out forwards;
}

@keyframes laser-ripple-anim {
  0% {
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -50%) scale(3.2);
    opacity: 0;
  }
}


/* ==========================================================================
   8. 箇条書き・リスト (インデント内部要素 & 行間対応)
   ========================================================================== */
.reveal ul {
  margin: 8px 0 12px 1.2em;
  padding: 0;
  display: block;
}

.reveal ul li {
  margin-bottom: 12px;
  line-height: 1.45;
}

/* 箇条書き項目の内部要素 (インデント継続行: 行間が詰まり、説明文として自然にレイアウト) */
.reveal ul li .list-body {
  display: inline-block;
  margin-top: 4px;
  font-size: 0.9em;
  line-height: 1.4;
  color: var(--text-main);
  opacity: 0.92;
}

/* リスト外の段落 (インデントなしの場合は左端から独立した行間あり段落として配置) */
.reveal section p {
  margin: 12px 0;
  line-height: 1.6;
}

  <script>
// Reveal.jsの初期化
Reveal.initialize({
  hash: true,
  slideNumber: 'c/t',
  showSlideNumber: 'all',
  transition: 'slide',
  center: false,
  width: 1280,
  height: 720,
  margin: 0,
  minScale: 0.1,
  maxScale: 4.0
});

// 1. 全画面表示 (Fullscreen)
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(err => {
        console.log('Fullscreen note:', err.message);
      });
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}



// Reveal.jsにFキーの全画面バインドを登録 (ブラウザ権限エラーを防止)
Reveal.addKeyBinding({ keyCode: 70, key: 'F', description: 'Toggle Fullscreen' }, function() {
  toggleFullscreen();
});

// --- レーザーポインター機能 (Zoom/画面共有用 DOMポインター & クリック波紋) ---
(function() {
  let isLaserActive = false;
  let laserPointerEl = null;

  function initLaserPointer() {
    // 1. ポインター要素の生成
    if (!laserPointerEl) {
      laserPointerEl = document.createElement('div');
      laserPointerEl.className = 'laser-pointer';
      document.body.appendChild(laserPointerEl);
    }

    // 2. コントロールバーの確認・ボタン追加
    let controlsBar = document.querySelector('.slide-controls-bar');
    if (!controlsBar) {
      controlsBar = document.createElement('div');
      controlsBar.className = 'slide-controls-bar';
      document.body.appendChild(controlsBar);
    }

    if (!document.getElementById('btn-laser')) {
      const laserBtn = document.createElement('button');
      laserBtn.className = 'control-btn';
      laserBtn.id = 'btn-laser';
      laserBtn.title = 'レーザーポインター (L)';
      laserBtn.innerHTML = '🔴 ポインター';
      laserBtn.onclick = toggleLaserPointer;
      controlsBar.appendChild(laserBtn);
    }

    // 3. マウス追従
    window.addEventListener('mousemove', function(e) {
      if (!isLaserActive || !laserPointerEl) return;
      laserPointerEl.style.left = e.clientX + 'px';
      laserPointerEl.style.top = e.clientY + 'px';
    });

    // 画面外に出たときの処理
    document.addEventListener('mouseleave', function() {
      if (laserPointerEl) laserPointerEl.style.opacity = '0';
    });
    document.addEventListener('mouseenter', function() {
      if (laserPointerEl && isLaserActive) laserPointerEl.style.opacity = '1';
    });

    // 4. クリック時の波紋（Ripple）エフェクト
    window.addEventListener('mousedown', function(e) {
      if (!isLaserActive) return;
      if (e.target.closest && e.target.closest('.control-btn')) return;

      createLaserRipple(e.clientX, e.clientY);
    });
  }

  function createLaserRipple(x, y) {
    const ripple = document.createElement('div');
    ripple.className = 'laser-ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    document.body.appendChild(ripple);
    setTimeout(function() {
      if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
    }, 500);
  }

  function toggleLaserPointer() {
    isLaserActive = !isLaserActive;
    document.body.classList.toggle('laser-pointer-active', isLaserActive);

    const btn = document.getElementById('btn-laser');
    if (btn) {
      btn.classList.toggle('laser-active', isLaserActive);
    }

    if (!isLaserActive && laserPointerEl) {
      laserPointerEl.style.opacity = '0';
    } else if (isLaserActive && laserPointerEl) {
      laserPointerEl.style.opacity = '1';
    }
  }

  window.toggleLaserPointer = toggleLaserPointer;

  // Reveal.js キーバインド登録 (L キー)
  if (typeof Reveal !== 'undefined' && Reveal.addKeyBinding) {
    Reveal.addKeyBinding({ keyCode: 76, key: 'L', description: 'Toggle Laser Pointer' }, function() {
      toggleLaserPointer();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLaserPointer);
  } else {
    initLaserPointer();
  }
})();


// シンタックスハイライト & 数式レンダリング
function initEnhancements() {
  if (typeof hljs !== 'undefined') {
    hljs.highlightAll();
  }
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
}

function resizePlotlyElement(el) {
  try {
    var container = el.closest('.included-chart-container') || el.parentElement;
    var w = container ? container.clientWidth : 0;
    var h = container ? container.clientHeight : 0;
    if (w === 0 || h === 0) return;

    var update = { autosize: true, width: w, height: h };

    if (!el._fullLayout || !el._fullLayout.scene) {
      update.margin = { l: 55, r: 25, t: 42, b: 42 };
      update['xaxis.automargin'] = true;
      update['yaxis.automargin'] = true;
      update.font = { size: 9 };
      update.titlefont = { size: 11 };
    }
    Plotly.relayout(el, update);
    Plotly.Plots.resize(el);
  } catch(e) {
    try { Plotly.Plots.resize(el); } catch(e2) {}
  }
}

// スライド切り替えイベント (Plotly遅延実行 & リサイズ)
function initPlotlyOnSlide(scopeEl) {
  if (!scopeEl) return;
  const root = scopeEl || document;

  // 1. 初回表示時のみ: 遅延されていたPlotlyスクリプトを実行
  const delayedScripts = root.querySelectorAll('script.plotly-delayed-script');
  delayedScripts.forEach(scriptEl => {
    const newScript = document.createElement('script');
    newScript.type = 'text/javascript';
    newScript.textContent = scriptEl.textContent;
    scriptEl.parentNode.insertBefore(newScript, scriptEl.nextSibling);
    scriptEl.classList.remove('plotly-delayed-script');
    scriptEl.classList.add('plotly-delayed-script-done');
  });

  // 2. 描画済みのグラフのリサイズ & ResizeObserver設定
  if (typeof Plotly !== 'undefined') {
    root.querySelectorAll('.plotly-graph-div, .js-plotly-plot, [id^="chart-"]').forEach(function(el) {
      resizePlotlyElement(el);

      var container = el.closest('.included-chart-container') || el.parentElement;
      if (container && typeof ResizeObserver !== 'undefined' && !container._plotlyObserver) {
        container._plotlyObserver = new ResizeObserver(function() {
          resizePlotlyElement(el);
        });
        container._plotlyObserver.observe(container);
      }
    });
  }
}

function updateSlideState(currentSlide) {
  var slide = currentSlide || Reveal.getCurrentSlide();
  var isTitle = false;
  if (slide) {
    isTitle = slide.classList.contains('title-section') || !!slide.querySelector('.title-slide');
  } else {
    var firstSection = document.querySelector('.reveal .slides > section');
    if (firstSection) {
      isTitle = firstSection.classList.contains('title-section') || !!firstSection.querySelector('.title-slide');
    }
  }
  document.body.classList.toggle('is-title-slide', isTitle);
}

function updateAgendaSteps(scopeEl) {
  var root = scopeEl || document;
  var container = root.querySelector('.agenda-list[data-agenda-steps]');
  if (!container) return;
  var raw = container.getAttribute('data-agenda-steps');
  if (!raw) return;
  try {
    var steps = JSON.parse(raw);
    if (!steps || !steps.length) return;
    var section = container.closest('section');
    if (!section) return;
    var visibleTriggers = section.querySelectorAll('.agenda-step-trigger.visible');
    var stepIdx = visibleTriggers.length;
    if (stepIdx >= steps.length) stepIdx = steps.length - 1;
    var step = steps[stepIdx];
    var items = container.querySelectorAll('.agenda-item');

    if (step === 'none') {
      items.forEach(function(item) {
        item.classList.remove('is-active', 'active-fixed', 'dimmed');
      });
    } else if (step === 'gray' || step === 'grey') {
      items.forEach(function(item) {
        item.classList.remove('is-active', 'active-fixed');
        item.classList.add('dimmed');
      });
    } else if (step === 'all') {
      items.forEach(function(item) {
        item.classList.add('is-active');
        item.classList.remove('dimmed');
      });
    } else {
      var activeIndices = Array.isArray(step) ? step : [step];
      items.forEach(function(item, idx) {
        if (activeIndices.indexOf(idx) !== -1) {
          item.classList.add('is-active');
          item.classList.remove('dimmed');
        } else {
          item.classList.remove('is-active', 'active-fixed');
          item.classList.add('dimmed');
        }
      });
    }
  } catch(e) {}
}

Reveal.on('ready', function(event) {
  initEnhancements();
  updateSlideState(event.currentSlide);
  updateAgendaSteps(event.currentSlide);
  setTimeout(function() { initPlotlyOnSlide(event.currentSlide); }, 100);
  setTimeout(function() { initPlotlyOnSlide(event.currentSlide); }, 500); // 念のため
});

Reveal.on('slidechanged', function(event) {
  updateSlideState(event.currentSlide);
  updateAgendaSteps(event.currentSlide);
  setTimeout(function() { initPlotlyOnSlide(event.currentSlide); }, 100);
  setTimeout(function() { initPlotlyOnSlide(event.currentSlide); }, 500);
});

Reveal.on('fragmentshown', function(event) {
  updateAgendaSteps(Reveal.getCurrentSlide());
});

Reveal.on('fragmenthidden', function(event) {
  updateAgendaSteps(Reveal.getCurrentSlide());
});

  </script>
